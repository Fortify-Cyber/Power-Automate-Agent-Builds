mcs.metadata:
  componentName: Office 365 Outlook - Find where threads are filed
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: Method
    value: GET

modelDisplayName: Find where threads are filed
modelDescription: "Read-only Microsoft Graph GET across the signed-in user's own mailbox that returns every email in the given conversations, in any folder, with the folder each one is in (parentFolderId) and who sent it. Used only to see which folder the user filed earlier emails from the same thread into. The results are never emails to suggest or file, and results in the Inbox, Sent Items, Drafts or Deleted Items say nothing about where the thread is filed. Uri must be exactly: https://graph.microsoft.com/v1.0/me/messages?$filter=conversationId eq '[ID1]' or conversationId eq '[ID2]'&$select=conversationId,parentFolderId,receivedDateTime,from,isDraft&$top=250 with one conversationId eq '[ID]' clause per conversation, joined with or, at most 10 conversations per call. Copy each conversationId exactly, but write any + in it as %2B. Use at most 2 calls."
action:
  kind: InvokeConnectorTaskAction
  connectionReference: fc_FilingSkillTest.shared_office365.shared-office365-bbd32e0e-5b2a-47fc-9a3a-0d68457aab4b
  connectionProperties:
    mode: Invoker

  operationId: HttpRequest

outputMode: All
