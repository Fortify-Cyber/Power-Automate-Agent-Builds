<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassin AI Hub (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Roboto+Serif:opsz,wght@8..144,300;8..144,400;8..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #021D3C;
    --primary: #00426C;
    --primary-dark: #003251;
    --blue: #0077CE;
    --sky: #4DD8FF;
    --sand: #EFE7DF;
    --sand-2: #F2ECE6;
    --sand-line: #DDD3CA;
    --soft: #EFF3F6;
    --soft-line: #C7D5DF;
    --prompt-bg: #F7F9FC;
    --text: #021D3C;
    --muted: #3B5068;
    --faint: #8B97A5;
    --line: #E4E1DD;
    --white: #FFFFFF;
    --live: #D7F0DD; --pilot: #D6E9F8; --next: #EFE7DF; --planned: #E4DCF5;
    --serif: "Roboto Serif", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--white); color: var(--text); font: 16px/1.55 var(--sans); }
  a { color: var(--blue); }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.2; margin: 0 0 .5em; color: var(--navy); }
  h2 { font-size: 30px; font-weight: 300; }
  h3 { font-size: 21px; }
  p { margin: 0 0 .8em; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Microsoft 365 suite bar */
  .suite { height: 48px; background: #1F1F1F; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 15px; }
  .waffle { width: 18px; height: 18px; display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; }
  .waffle i { width: 4px; height: 4px; background: #fff; display: block; }
  .suite .search { margin-left: auto; margin-right: auto; width: min(460px, 45vw); height: 32px; border-radius: 4px; background: #fff; color: #616161; display: flex; align-items: center; padding: 0 12px; font-size: 14px; }
  .suite .me { width: 30px; height: 30px; border-radius: 50%; background: var(--sky); color: var(--navy); font-weight: 600; font-size: 13px; display: grid; place-items: center; }

  /* Site header (Strong emphasis) */
  header.site { background: var(--primary); color: #fff; }
  .site-top { max-width: 1240px; margin: 0 auto; padding: 18px 24px 10px; display: flex; align-items: center; gap: 16px; }
  .site-top svg { width: 52px; height: 52px; flex: none; }
  .site-name { font-family: var(--serif); font-size: 26px; font-weight: 300; letter-spacing: .2px; }
  .site-sub { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #C7D5DF; }
  nav.top { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.top::-webkit-scrollbar { display: none; }
  nav.top a, nav.top .dd > button { color: #fff; text-decoration: none; padding: 10px 12px 12px; white-space: nowrap; font-size: 15px; border: 0; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
  nav.top a:hover, nav.top .dd > button:hover { background: rgba(255,255,255,.08); }
  nav.top a.on, nav.top .dd.on > button { border-bottom-color: var(--sky); }
  .dd { position: relative; }
  .dd-menu { display: none; position: absolute; left: 0; top: 100%; background: #fff; min-width: 230px; box-shadow: 0 6px 24px rgba(2,29,60,.18); z-index: 20; padding: 6px 0; }
  .dd.open .dd-menu { display: block; }
  .dd-menu a { display: block; color: var(--text) !important; padding: 9px 16px !important; border: 0 !important; }
  .dd-menu a:hover { background: var(--soft) !important; }

  /* Page title (ColorBlock header) */
  .page-title { background: var(--navy); color: #fff; }
  .page-title .in { max-width: 1240px; margin: 0 auto; padding: 34px 24px 30px; }
  .page-title h1 { color: #fff; font-size: 40px; font-weight: 300; margin: 0; }
  .eyebrow { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .page-title .eyebrow { color: #9FB6C9; }

  /* Sections and emphasis */
  .sec { padding: 28px 0; }
  .sec.e1 { background: var(--sand-2); }
  .sec.e2 { background: var(--soft); }
  .sec.e3 { background: var(--primary); color: #fff; }
  .sec.e3 h2, .sec.e3 h3, .sec.e3 a { color: #fff; }
  .sec.e3 p { color: #E3ECF3; font-size: 18px; max-width: 760px; }
  .sec .in { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: grid; gap: 32px; }
  .t-OneColumn { grid-template-columns: 1fr; }
  .t-TwoColumn { grid-template-columns: 1fr 1fr; }
  .t-ThreeColumn { grid-template-columns: 1fr 1fr 1fr; }
  .t-TwoColumnLeft { grid-template-columns: 2fr 1fr; }
  .t-TwoColumnRight { grid-template-columns: 1fr 2fr; }
  .col > * + * { margin-top: 14px; }
  .sec.e1 + .sec.e1 { padding-top: 0; }
  .t-ThreeColumn .col { border-top: 3px solid var(--primary); padding-top: 16px; }
  .sec.e3 .t-ThreeColumn .col { border-top-color: var(--sky); }
  .rte ol, .rte ul { padding-left: 22px; margin: 0 0 1em; }
  .rte li { margin-bottom: 6px; }
  .rte table { border-collapse: collapse; width: 100%; margin: 6px 0 16px; font-size: 15px; }
  .rte td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
  .rte tr:first-child td { background: var(--sand-2); }

  /* Buttons and chips */
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; border: 0; padding: 9px 18px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--soft-line); }
  .btn.ghost:hover { background: var(--soft); }
  .btn.sm { padding: 5px 12px; font-size: 14px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 12px; background: var(--soft); color: var(--primary); font-weight: 600; margin: 0 4px 4px 0; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 600; color: var(--navy); }
  .p-Live, .p-Done { background: var(--live); } .p-Pilot, .p-Reviewing { background: var(--pilot); }
  .p-Up.next, .p-New { background: var(--next); } .p-Planned { background: var(--planned); } .p-Proposed { background: #eee; }

  /* Prompt cards */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: #fff; border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; }
  .card h4 { font-size: 18px; margin-bottom: 8px; }
  .card .meta { margin-bottom: 10px; }
  .prompt { border-left: 4px solid var(--primary); background: var(--prompt-bg); padding: 10px 14px; font-style: italic; white-space: pre-wrap; font-size: 15px; margin: 0 0 12px; }
  .card .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  details.more { font-size: 14.5px; color: var(--muted); margin-bottom: 12px; }
  details.more summary { cursor: pointer; color: var(--primary); font-weight: 600; }
  details.more p { margin: 6px 0 0; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .toolbar input { flex: 1 1 260px; padding: 9px 12px; border: 1px solid var(--soft-line); font: inherit; }
  .filter { border: 1px solid var(--soft-line); background: #fff; padding: 5px 12px; cursor: pointer; font-size: 14px; color: var(--primary); }
  .filter.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .group-h { font-family: var(--sans); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 26px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .group-h:first-child { margin-top: 0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--sand-line); }

  /* Tips */
  .tip { display: grid; grid-template-columns: 92px 1fr; gap: 20px; background: #fff; border: 1px solid var(--line); padding: 20px; margin-bottom: 16px; }
  .tip .num { background: var(--primary); color: #fff; text-align: center; padding: 10px 6px; height: fit-content; }
  .tip .num b { display: block; font-family: var(--serif); font-size: 34px; font-weight: 300; line-height: 1; }
  .tip .num span { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .tip ol { padding-left: 20px; margin: 4px 0 12px; }
  .tip h5 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  .compact { background: #fff; border: 1px solid var(--line); padding: 16px 18px; }
  .compact .date { font-size: 13px; color: var(--muted); }

  /* News */
  .news { display: grid; gap: 16px; }
  .news a.item { display: grid; grid-template-columns: 150px 1fr; gap: 16px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .news .thumb { background: linear-gradient(135deg, var(--primary), var(--navy)); min-height: 92px; position: relative; }
  .news .thumb::after { content: ""; position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; background: var(--sky); }
  .news h4 { font-size: 19px; margin-bottom: 4px; }
  .news a.item:hover h4 { color: var(--blue); }
  .news p { color: var(--muted); font-size: 15px; margin: 0; }
  .article { max-width: 760px; }

  /* FAQ */
  details.faq { border-bottom: 1px solid var(--line); padding: 12px 0; }
  details.faq summary { cursor: pointer; font-weight: 600; font-size: 17px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  details.faq summary::after { content: "+"; color: var(--primary); font-size: 22px; line-height: 1; }
  details.faq[open] summary::after { content: "–"; }
  details.faq p { margin: 8px 0 4px; color: var(--muted); max-width: 820px; }

  /* Table */
  table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.list th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 8px; }
  table.list td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: top; }

  /* Footer */
  footer.site { background: var(--primary); color: #fff; margin-top: 0; }
  footer.site .in { max-width: 1240px; margin: 0 auto; padding: 22px 24px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  footer.site a { color: #fff; text-decoration: none; font-size: 14px; }
  footer.site .name { font-family: var(--serif); font-size: 17px; margin-right: auto; }

  /* Modal, toast, preview tag */
  .scrim { position: fixed; inset: 0; background: rgba(2,29,60,.45); display: none; z-index: 50; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: #fff; z-index: 51; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  .panel.open { transform: none; } .panel.open ~ .scrim, .scrim.open { display: block; }
  .panel header { padding: 20px 24px 8px; display: flex; justify-content: space-between; align-items: start; }
  .panel header h3 { margin: 0; }
  .panel .x { border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); }
  .panel form { padding: 8px 24px 24px; overflow-y: auto; }
  .panel label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
  .panel .hint { font-weight: 400; color: var(--muted); }
  .panel input[type=text], .panel select, .panel textarea { width: 100%; padding: 8px 10px; border: 1px solid #8a8886; font: inherit; }
  .panel textarea { min-height: 110px; }
  .panel .checks label { display: inline-flex; gap: 6px; font-weight: 400; margin: 4px 14px 0 0; }
  .panel .foot { display: flex; gap: 10px; margin-top: 22px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 18px; opacity: 0; transition: .2s; z-index: 60; font-size: 15px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .tag { font-size: 12px; color: #1F1F1F; background: var(--sky); padding: 2px 8px; font-weight: 600; }

  @media (max-width: 860px) {
    .t-TwoColumn, .t-ThreeColumn, .t-TwoColumnLeft, .t-TwoColumnRight { grid-template-columns: 1fr; }
    .sec .in, .site-top, .page-title .in, footer.site .in { padding-left: 16px; padding-right: 16px; }
    .page-title h1 { font-size: 30px; }
    .suite .search { display: none; }
    .tip { grid-template-columns: 1fr; }
    .tip .num { display: flex; gap: 10px; align-items: baseline; justify-content: flex-start; padding: 8px 12px; }
    .tip .num b { font-size: 24px; }
    .news a.item { grid-template-columns: 90px 1fr; }
    .grid { grid-template-columns: 1fr; }
    .site-name { font-size: 22px; }
  }
</style>
</head>

<script>
const DATA = {"prompts": [{"Title": "Turn a long email thread into an open-issues list", "Category": "Deal management", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Outlook"], "Prompt": "Using the emails I referenced, build an open-issues list for [matter]. Table columns: # | Issue | Raised by (name and party) | Who owes the next action | What is owed | Due date (write 'none stated' if no date) | Status (open, agreed, closed) | Date of the latest email on it. Treat an issue as closed only if every side confirmed it in writing. List items with no clear owner in a separate section. Do not guess dates or owners.", "HowToUse": "Open Copilot Chat, type / and use the Emails tab to add the most recent messages in the thread, then paste the prompt.", "WatchOuts": "Check each item against the cited emails before you circulate the list, and keep it marked draft until an attorney has reviewed it.", "Featured": true, "Contributor": "Friday Tip, Oct 23"}, {"Title": "Summarize an email thread: decided, open, next", "Category": "Email & correspondence", "Practice": "All practices", "WorksIn": ["Outlook", "Copilot Chat"], "Prompt": "Summarize this email thread in 3 bullets: what was decided, what's still open, and what I need to do next.", "HowToUse": "In Outlook, open the conversation and select Summary by Copilot, or paste this into Copilot Chat with the thread attached.", "WatchOuts": "Click the numbered citations to jump to the original emails before you act on the summary.", "Featured": true, "Contributor": "Friday Tip, Oct 2"}, {"Title": "Polite decline with two alternative times", "Category": "Email & correspondence", "Practice": "All practices", "WorksIn": ["Outlook"], "Prompt": "Write a polite email declining a meeting invitation for [day], offering two alternative times later in the week.", "HowToUse": "In Outlook, start a reply, select the Copilot icon, then Draft. Adjust length or tone, select Keep it, then edit and send.", "WatchOuts": "Check the times against your calendar before sending.", "Featured": false, "Contributor": "Friday Tip, Oct 9"}, {"Title": "Summarize a document and pull out deadlines and dollar amounts", "Category": "Document review", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "Summarize this document in 5 bullet points, then list any deadlines, dollar amounts or action items it mentions, with the section or page where each appears.", "HowToUse": "In Copilot Chat, select + (Add content) and attach the file, or type / and start typing the file name.", "WatchOuts": "Long documents can be summarized unevenly. Spot-check the figures against the source pages.", "Featured": true, "Contributor": "Friday Tip, Oct 16"}, {"Title": "Compare a term sheet to the draft loan agreement", "Category": "Document review", "Practice": "Balance sheet & bridge lending", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "Compare the attached term sheet with the attached draft loan agreement. Build a table: Term | Term sheet says | Loan agreement says (with section number) | Consistent? (yes, no, not addressed) | Note. Cover at least: loan amount, interest rate and index, maturity and extensions, amortization, prepayment, yield maintenance or exit fee, recourse and carve-outs, reserves, financial covenants (DSCR, LTV, debt yield), cash management, guarantor requirements and assignment. Then list anything in the term sheet that the draft does not reflect. Quote section numbers. If something is unclear, say so rather than inferring.", "HowToUse": "Attach both documents in Copilot Chat. For long agreements, run it on the economic terms first, then the covenants.", "WatchOuts": "This is an issue-spotting aid, not a sign-off. Confirm every 'not addressed' row yourself.", "Featured": true, "Contributor": "Fortify starter set"}, {"Title": "Extract key loan terms into a deal summary table", "Category": "Document review", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "From the attached loan agreement, fill in this table: Borrower | Guarantor(s) | Lender | Loan amount | Closing date | Maturity date | Extension options | Interest rate (index and spread, or fixed) | Prepayment terms | Recourse and carve-outs | Reserves (type and amount) | Financial covenants. Give the section number for every value. Write 'not found' rather than guessing.", "HowToUse": "Attach the agreement in Copilot Chat. Paste the result into your deal summary template and check each cell.", "WatchOuts": "Defined terms can hide the real number (for example 'Applicable Margin'). Follow the definition.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Build a closing checklist from a commitment letter", "Category": "Deal management", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "Using the attached commitment letter, draft a closing checklist for [deal name]. Group items under: Loan documents, Borrower and guarantor organizational documents, Title and survey, Third-party reports, Insurance, Opinions, Closing deliverables and Post-closing. Columns: # | Item | Responsible party (if stated) | Source (section of the commitment) | Status (leave blank). Only include items the commitment actually requires, and list anything ambiguous separately at the end.", "HowToUse": "Attach the commitment letter. Paste the table into your firm checklist template and add firm-standard items.", "WatchOuts": "Copilot only sees the commitment you gave it. Add lender-specific and program requirements yourself.", "Featured": true, "Contributor": "Fortify starter set"}, {"Title": "Review a title commitment: requirements and exceptions", "Category": "Document review", "Practice": "All practices", "WorksIn": ["Copilot Chat"], "Prompt": "Review the attached title commitment. List every Schedule B-I requirement and Schedule B-II exception in a table: # | Item (short description) | Type (requirement or exception) | Recorded document reference, if any | What it appears to affect | Suggested next step (satisfy at closing, request removal, endorsement, request copy, or attorney to review) | Question for the title company. Do not draw conclusions about insurability.", "HowToUse": "Attach the commitment PDF in Copilot Chat.", "WatchOuts": "Scanned PDFs may read poorly. If items are missing, check the page count against the original.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Summarize a redline by who it favors", "Category": "Document review", "Practice": "All practices", "WorksIn": ["Word", "Copilot Chat"], "Prompt": "Summarize the changes in this redline. Table: Section | What changed | Favors lender, borrower or neutral | Substantive or clean-up. Put substantive changes first. Quote the changed language for anything substantive.", "HowToUse": "Open the comparison document in Word and use Copilot, or attach it in Copilot Chat.", "WatchOuts": "Copilot reads the document as it appears. Confirm it picked up deletions as well as insertions.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Check defined terms", "Category": "Drafting", "Practice": "All practices", "WorksIn": ["Word"], "Prompt": "List every defined term in this document with the section where it is defined. Then flag: terms used but never defined, terms defined but never used, terms defined more than once, and capitalized words that look like defined terms but are not defined.", "HowToUse": "Open the document in Word and select Copilot.", "WatchOuts": "Terms defined in another document (for example the loan agreement) will show as undefined. That's expected.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Check cross-references", "Category": "Drafting", "Practice": "All practices", "WorksIn": ["Word"], "Prompt": "Check the internal cross-references in this document. List any reference to a section, exhibit or schedule that does not exist, and any reference whose target section seems to be about a different topic than the sentence implies. Give the location of each.", "HowToUse": "Open the document in Word and select Copilot.", "WatchOuts": "Run it after the last round of renumbering.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Proofread without changing substance", "Category": "Drafting", "Practice": "All practices", "WorksIn": ["Word"], "Prompt": "Proofread this section for typos, inconsistent capitalization of defined terms, and number and word mismatches (for example 'ten (11)'). Don't change the substance. List each fix as: location | current text | suggested text.", "HowToUse": "Select the section in Word, then ask Copilot.", "WatchOuts": "Accept fixes yourself rather than letting Copilot rewrite the section.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Explain a provision in plain English", "Category": "Drafting", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "Explain [provision, for example the cash management provisions in Section X] in plain English for a business reader, in under 120 words. Describe what it does and when it applies. Do not give legal conclusions.", "HowToUse": "Attach or open the document, then ask.", "WatchOuts": "Review before it goes to a client. It is a starting draft, not advice.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Track diligence received and outstanding from email", "Category": "Deal management", "Practice": "All practices", "WorksIn": ["Copilot Chat"], "Prompt": "Search my emails from the last [2 weeks] about [deal name]. List the diligence items that were received and those still outstanding. Table: Item | Received or outstanding | From whom | Date of the email | Link to the email. If an item is mentioned but it's unclear whether it arrived, list it as 'unclear'.", "HowToUse": "Open Copilot Chat (work mode) and paste the prompt with the deal name filled in.", "WatchOuts": "Copilot only finds what's in your mailbox. Items sent to a colleague won't appear.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Brief me before a call", "Category": "Meetings & calls", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Teams"], "Prompt": "I have a call about [matter] at [time]. From my recent emails, chats, meetings and files about it, give me a one-page briefing: where things stand, open issues, what the other side last asked for, and three questions I should raise. Cite your sources.", "HowToUse": "Open Copilot Chat in Teams or on the web 10 minutes before the call.", "WatchOuts": "Open the cited emails for anything you plan to rely on during the call.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Recap a Teams meeting", "Category": "Meetings & calls", "Practice": "All practices", "WorksIn": ["Teams"], "Prompt": "Recap this meeting: decisions made, action items with owner and due date, and open questions. Keep it under 200 words and note anything that was discussed but not decided.", "HowToUse": "Open the meeting in Teams (it must have been recorded or transcribed) and select Copilot or Recap.", "WatchOuts": "Only works for meetings with transcription on. Confirm owners and dates with the attendees.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Draft a weekly client status update", "Category": "Email & correspondence", "Practice": "All practices", "WorksIn": ["Outlook", "Copilot Chat"], "Prompt": "Draft a short status update to [client contact] on [deal]: what got done this week, what's outstanding and who owes it, and the target closing date. Plain, professional tone, under 150 words. Use only facts from my recent emails about this deal, and leave a [bracket] wherever you're not sure.", "HowToUse": "Use Draft with Copilot in Outlook, or Copilot Chat in work mode so it can read your recent emails.", "WatchOuts": "Check every date and every name before it goes to the client.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "A second opinion on a tricky email", "Category": "Email & correspondence", "Practice": "All practices", "WorksIn": ["Outlook", "Copilot Chat"], "Prompt": "Review my draft reply below. Tell me how it may come across to [recipient], flag anything that's ambiguous or could be read as a commitment, and suggest a clearer version that keeps my voice.\n\n[paste draft]", "HowToUse": "In Outlook, use Coaching by Copilot on your draft, or paste the draft into Copilot Chat with this prompt.", "WatchOuts": "You decide what to change. Copilot doesn't know the history with this person.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Rent roll quick analysis", "Category": "Excel & data", "Practice": "Leasing", "WorksIn": ["Excel"], "Prompt": "In this rent roll, show total occupied square feet, occupancy percentage, and leases expiring within 24 months of [date], grouped by year. Flag rows with missing rent, square footage or expiration dates.", "HowToUse": "Open the rent roll in Excel. Format the data as a table (Ctrl+T) first, then select Copilot.", "WatchOuts": "Copilot in Excel works best on clean tables with one header row. Check totals against the source.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Compare a tenant estoppel to the lease", "Category": "Document review", "Practice": "Leasing", "WorksIn": ["Copilot Chat"], "Prompt": "Compare the attached tenant estoppel certificate to the attached lease (and amendments). Table: Topic | Estoppel says | Lease says (with section) | Consistent? Cover: parties, premises, term and commencement date, current rent, rent escalations, security deposit, options (renewal, expansion, purchase, termination), defaults claimed and prepaid rent. List any inconsistencies first.", "HowToUse": "Attach the estoppel, the lease and every amendment.", "WatchOuts": "If an amendment is missing, Copilot will flag a false inconsistency. Check the lease chain first.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Find precedent documents", "Category": "Research & summaries", "Practice": "All practices", "WorksIn": ["Copilot Chat"], "Prompt": "Find documents in our SharePoint and OneDrive about [topic, for example a bridge loan with a mezzanine intercreditor] from [timeframe]. List file name, location, last modified date and a one-line description of each. Don't open or summarize them yet.", "HowToUse": "Open Copilot Chat in work mode.", "WatchOuts": "Copilot only finds files you already have access to.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Draft time-entry narratives from my day", "Category": "Getting organized", "Practice": "Firm operations", "WorksIn": ["Copilot Chat"], "Prompt": "From my sent emails, meetings and documents I edited on [date], draft time-entry narratives grouped by client and matter: Matter | Task description (start with an active verb, client-billing style) | Time estimate from meeting length, where there was a meeting. Mark every estimate clearly as an estimate. Don't invent tasks.", "HowToUse": "Open Copilot Chat in work mode at the end of the day.", "WatchOuts": "A drafting aid only. You confirm every entry and every time value before entering it.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Plan my week", "Category": "Getting organized", "Practice": "All practices", "WorksIn": ["Copilot Chat", "Outlook"], "Prompt": "Look at my calendar and flagged emails for next week. List deadlines and meetings by day, point out conflicts, and suggest two-hour focus blocks for drafting.", "HowToUse": "Open Copilot Chat in work mode on Friday afternoon or Monday morning.", "WatchOuts": "Copilot suggests blocks but won't book them. Add them yourself.", "Featured": false, "Contributor": "Fortify starter set"}, {"Title": "Have Copilot write the prompt for you", "Category": "Getting started", "Practice": "All practices", "WorksIn": ["Copilot Chat"], "Prompt": "I want to [describe the task]. Before you do anything, ask me up to five questions you need answered to do it well. Then write the best prompt for this task that I can save and reuse.", "HowToUse": "Use it whenever you're not sure how to ask. Save the result to the Prompt Library.", "WatchOuts": "None. It's a good habit.", "Featured": true, "Contributor": "Fortify starter set"}, {"Title": "Estate plan document request list", "Category": "Drafting", "Practice": "Private client", "WorksIn": ["Copilot Chat", "Word"], "Prompt": "Draft a client-friendly checklist of the documents and information we need for an estate plan review for [client type, for example a married couple with a closely held business]. Group by category, with one sentence on why we need each item. Keep it to one page.", "HowToUse": "Paste the result into the firm letterhead template and edit.", "WatchOuts": "Compare it to the firm's standard intake list before sending.", "Featured": false, "Contributor": "Fortify starter set"}], "tips": [{"TipNumber": 1, "Title": "Catch up on any email thread in seconds", "TipDate": "2026-10-02", "Headline": "Summarize a long email thread in Outlook", "WorksWith": "Copilot Chat (everyone)", "WhyItHelps": "Get the key points of a long back-and-forth without scrolling through every reply.", "Steps": "1. In Outlook, open the long email conversation\n2. Select Summary by Copilot (or Summarize) at the top of the thread\n3. Read the summary and click the numbered citations to jump to the original emails", "Prompt": "Summarize this email thread in 3 bullets: what was decided, what's still open, and what I need to do next.", "VideoLink": "https://www.youtube.com/watch?v=D-DfXUSbQcw", "VideoTitle": "Summarize and draft emails with Microsoft 365 Copilot in Outlook", "ArticleLink": "https://support.microsoft.com/en-us/outlook/copilot-pages/summarize-an-email-thread-with-copilot-in-outlook", "ArticleTitle": "Summarize an email thread with Copilot in Outlook"}, {"TipNumber": 2, "Title": "Beat the blank email", "TipDate": "2026-10-09", "Headline": "Draft an email with Copilot in Outlook", "WorksWith": "Copilot Chat (everyone)", "WhyItHelps": "Copilot writes a solid first draft from a one-line request, so you just review, tweak and send.", "Steps": "1. In Outlook, start a New mail (or a reply)\n2. Select the Copilot icon in the toolbar, then Draft (classic Outlook: Draft with Copilot)\n3. Type what you want to say and select Generate\n4. Adjust length or tone, select Keep it, then edit and send", "Prompt": "Write a polite email declining a meeting invitation for next Tuesday, offering two alternative times later in the week.", "VideoLink": "https://www.youtube.com/watch?v=PrI7xxo8AKQ", "VideoTitle": "5 Ways to Use Copilot in Outlook | Microsoft 365", "ArticleLink": "https://support.microsoft.com/en-us/outlook/copilot-pages/draft-an-email-message-with-copilot-in-outlook", "ArticleTitle": "Draft an email message with Copilot in Outlook"}, {"TipNumber": 3, "Title": "Hand Copilot a file and ask away", "TipDate": "2026-10-16", "Headline": "Upload a file and ask Copilot about it", "WorksWith": "Copilot Chat (everyone)", "WhyItHelps": "Get a quick summary or answers from a long PDF, Word doc or spreadsheet without reading every page.", "Steps": "1. In Copilot Chat, type what you want, e.g. Summarize the document\n2. Select the + (Add content) button, then Upload images and files or Attach cloud files\n3. Pick your file and select Send\n4. Tip: you can also type / and start typing a file name to add it", "Prompt": "Summarize this document in 5 bullet points, then list any deadlines, dollar amounts or action items it mentions.", "VideoLink": "https://www.youtube.com/watch?v=75vF2ysGgbo", "VideoTitle": "Analyze an uploaded document with Microsoft 365 Copilot Chat", "ArticleLink": "https://support.microsoft.com/en-us/microsoft-365-copilot/analyze-an-uploaded-document-in-copilot-chat", "ArticleTitle": "Analyze an uploaded document in Copilot Chat"}, {"TipNumber": 4, "Title": "Turn a long email thread into an open-issues list", "TipDate": "2026-10-23", "Headline": "Turn a long email thread into an open-issues list", "WorksWith": "Microsoft 365 Copilot license", "WhyItHelps": "You get a who-owes-what-by-when list from a long thread with opposing counsel, the client or the other side in minutes, instead of rebuilding it by hand before every call.", "Steps": "1. Open Copilot Chat (in new Outlook or Outlook on the web, select the Copilot button at the top; or go to m365.cloud.microsoft/chat) and make sure Work IQ is turned on\n2. Type / and use the Emails tab to add the most recent messages in the thread\n3. Paste the prompt below and send\n4. Check each item against the cited emails before you circulate the list, and keep it marked draft until an attorney has reviewed it", "Prompt": "Using the emails I referenced, build an open-issues list for [matter]. Table columns: # | Issue | Raised by (name and party) | Who owes the next action | What is owed | Due date (write 'none stated' if no date) | Status (open, agreed, closed) | Date of the latest email on it. Treat an issue as closed only if every side confirmed it in writing. List items with no clear owner in a separate section. Do not guess dates or owners.", "VideoLink": "https://www.youtube.com/watch?v=7MA6VwMV-Qc", "VideoTitle": "Catch Up on Long Email Threads Faster with Copilot", "ArticleLink": "https://support.microsoft.com/en-us/microsoft-365-copilot/refer-to-specific-files-and-more-in-microsoft-365-copilot", "ArticleTitle": "Refer to specific files and more in Microsoft Copilot"}], "videos": [{"Title": "Summarize and draft emails with Microsoft 365 Copilot in Outlook", "VideoLink": "https://www.youtube.com/watch?v=D-DfXUSbQcw", "App": "Outlook", "Source": "Microsoft", "Level": "Beginner", "Description": "Thread summaries and first drafts in Outlook. Goes with Friday Tip 1."}, {"Title": "5 Ways to Use Copilot in Outlook", "VideoLink": "https://www.youtube.com/watch?v=PrI7xxo8AKQ", "App": "Outlook", "Source": "Microsoft", "Level": "Beginner", "Description": "Drafting, coaching, summarizing and scheduling with Copilot in Outlook. Goes with Friday Tip 2."}, {"Title": "Analyze an uploaded document with Microsoft 365 Copilot Chat", "VideoLink": "https://www.youtube.com/watch?v=75vF2ysGgbo", "App": "Copilot Chat", "Source": "Microsoft", "Level": "Beginner", "Description": "Attach a PDF, Word document or spreadsheet and ask questions about it. Goes with Friday Tip 3."}, {"Title": "Catch up on long email threads faster with Copilot", "VideoLink": "https://www.youtube.com/watch?v=7MA6VwMV-Qc", "App": "Copilot Chat", "Source": "Microsoft", "Level": "Intermediate", "Description": "Reference specific emails in Copilot Chat and get a structured answer. Goes with Friday Tip 4."}], "agents": [{"Title": "Daily Digest", "AgentStatus": "Live", "WhatItDoes": "A morning summary of your inbox: high priority items, emails waiting on your reply, team items you're copied on, and updates, with marketing filtered out. It reads only your own mailbox, with your own sign-in.", "HowToStart": "Open Daily Digest in Microsoft 365 Copilot, Teams or Outlook and say \"Run my daily digest\". To get it every weekday, schedule that prompt once (about 5 minutes).", "Champion": ""}, {"Title": "Email Filing Assistant", "AgentStatus": "Pilot", "WhatItDoes": "Suggests the client or matter folder for emails you've already dealt with. It never moves anything on its own: you confirm every filing, and it never touches flags or categories. Optional.", "HowToStart": "Currently with a small pilot group. Tell us in Feedback if you'd like to try it.", "Champion": ""}, {"Title": "Closing Checklist Builder", "AgentStatus": "Up next", "WhatItDoes": "Builds a first-draft closing checklist from the commitment letter and loan documents. One of the two leading candidates from the AI Working Group vote.", "HowToStart": "Not available yet. Use the 'Build a closing checklist from a commitment letter' prompt in the Prompt Library in the meantime.", "Champion": ""}, {"Title": "Deal Intake and Issues List Builder", "AgentStatus": "Up next", "WhatItDoes": "Captures a new deal's key facts and keeps a running issues list from the email traffic. One of the two leading candidates from the AI Working Group vote.", "HowToStart": "Not available yet. Use the 'Turn a long email thread into an open-issues list' prompt in the meantime.", "Champion": ""}], "faq": [{"Title": "Do I have Microsoft 365 Copilot?", "Topic": "Getting started", "Answer": "Yes. Everyone at the firm has a Microsoft 365 Copilot license. That gives you Copilot Chat plus Copilot inside Outlook, Word, Excel, PowerPoint and Teams, and lets Copilot work with your own email, meetings and files."}, {"Title": "Where do I find Copilot?", "Topic": "Getting started", "Answer": "Go to m365.cloud.microsoft/chat, or select Copilot in Teams, Outlook, Word or Excel. In Outlook and Word, look for the Copilot icon in the toolbar."}, {"Title": "Can I use Copilot with client and matter information?", "Topic": "Using AI responsibly", "Answer": "Microsoft 365 Copilot works inside the firm's Microsoft 365 environment and only sees what you already have access to. Microsoft doesn't use your prompts or files to train its models. Follow the firm's policies for client and confidential information, and don't paste client information into public AI tools such as free ChatGPT or Gemini."}, {"Title": "Can I trust what Copilot tells me?", "Topic": "Using AI responsibly", "Answer": "Treat it like a first draft from a capable junior: useful, fast and sometimes wrong. Click the citations, check figures and dates against the source, and have an attorney review anything going to a client or the other side."}, {"Title": "Why does Copilot give different answers to the same question?", "Topic": "Getting better results", "Answer": "Answers vary a little each time. Be specific: say what you want, the format (a table, bullets, a word limit) and what to do when it's unsure (for example 'write not found rather than guessing'). The prompts in the Prompt Library already do this."}, {"Title": "Copilot couldn't find an email or file I know exists. Why?", "Topic": "Getting better results", "Answer": "Name it directly: type / in Copilot Chat and pick the email or file. Very recent items can take a few minutes to become searchable, and Copilot can only see items you have access to."}, {"Title": "How do I get the Daily Digest?", "Topic": "Agents", "Answer": "Open Daily Digest in Microsoft 365 Copilot, Teams or Outlook and say \"Run my daily digest\". You can schedule that prompt for every weekday morning. See Agents & Tools for details."}, {"Title": "How do I add a prompt to the Prompt Library?", "Topic": "This site", "Answer": "Open the Prompt Library and select Submit a prompt. Your prompt is visible to you straight away and to everyone else once the AI Working Group approves it."}, {"Title": "I missed a Friday tip. Where can I find it?", "Topic": "This site", "Answer": "Every tip is in Friday Tips, newest first, with its prompt, steps and video."}, {"Title": "Who do I ask for help?", "Topic": "Getting started", "Answer": "Ask the AI Working Group, or use Feedback on this site. Fortify Cyber supports the program and reads every submission."}], "news": [{"Name": "Welcome-to-the-AI-Hub", "Title": "Welcome to the Cassin AI Hub", "Description": "One place for prompts, Friday tips, videos and agents.", "Html": "<p>The AI Hub is the firm's home for getting more out of Microsoft 365 Copilot. You'll find:<\/p><ul><li><strong>Prompt Library:<\/strong> prompts written for our deals and documents, from term sheet comparisons to closing checklists. Add your own.<\/li><li><strong>Friday Tips:<\/strong> every weekly tip, with the steps, the prompt and a video.<\/li><li><strong>Demo Videos:<\/strong> short walkthroughs for Outlook, Word, Excel, Teams and Copilot Chat.<\/li><li><strong>Agents &amp; Tools:<\/strong> Daily Digest, the Email Filing Assistant and what's coming next.<\/li><\/ul><p>The site is run by the AI Working Group with Fortify Cyber. If something's missing, use <a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">Feedback<\/a> and tell us.<\/p>"}, {"Name": "Meet-Daily-Digest", "Title": "Meet Daily Digest: your inbox, sorted before you start", "Description": "A morning summary of what needs you, from your own mailbox.", "Html": "<p>Daily Digest is a Copilot agent that reads your inbox and gives you a short morning briefing: 🔴 high priority, 📨 waiting on your reply, 👥 team items you're copied on, and 📰 updates, with marketing and cold outreach filtered out.<\/p><p><strong>To try it:<\/strong> open Daily Digest in Microsoft 365 Copilot, Teams or Outlook and say \"Run my daily digest\". To get it every weekday, schedule that prompt once. It takes about five minutes.<\/p><p>It only reads your own mailbox, with your own sign-in, and the only email it can send is your digest, to you.<\/p>"}, {"Name": "Email-Filing-Assistant-Pilot", "Title": "Email Filing Assistant: suggest, never auto-move", "Description": "What the pilot is testing and how it was designed with the team.", "Html": "<p>After the AI Working Group's feedback, the Email Filing Assistant follows a few firm rules:<\/p><ul><li>It only suggests a folder for emails you've already dealt with.<\/li><li>You confirm every filing. Nothing moves on its own.<\/li><li>It never touches flags or categories.<\/li><li>It's optional. If you don't use folders, you don't have to use it.<\/li><\/ul><p>A small pilot group is testing it now. If you'd like to join, or have thoughts on how filing should work, <a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">let us know<\/a>.<\/p>"}], "pages": [{"Name": "Hub-Home", "Title": "Home", "Layout": "Home", "IsHomePage": true, "Sections": [{"Template": "OneColumn", "Emphasis": 3, "Columns": [[{"Type": "Text", "Html": "<h2>Welcome to the Cassin AI Hub<\/h2><p>Everything you need to get more out of Microsoft 365 Copilot at Cassin &amp; Cassin: ready-to-use prompts for deals, email and documents, every Friday tip, short how-to videos, and the agents built for the firm.<\/p><p><a href=\"{{siteUrl}}/SitePages/Get-Started.aspx\"><strong>New to Copilot? Start here →<\/strong><\/a><\/p>"}]]}, {"Template": "ThreeColumn", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<h3>Prompt Library<\/h3><p>Tested prompts for loan documents, closing checklists, client updates and more. Copy, fill in the [brackets], go.<\/p><p><a href=\"{{siteUrl}}/SitePages/Prompt-Library.aspx\">Browse prompts →<\/a><\/p>"}], [{"Type": "Text", "Html": "<h3>Friday Tips<\/h3><p>Every Friday Copilot Tip in one place: the steps, the prompt and a short video. Missed one? It's here.<\/p><p><a href=\"{{siteUrl}}/SitePages/Friday-Tips.aspx\">See all tips →<\/a><\/p>"}], [{"Type": "Text", "Html": "<h3>Demo Videos<\/h3><p>Two-to-five-minute walkthroughs of Copilot in Outlook, Word, Excel, Teams and Copilot Chat.<\/p><p><a href=\"{{siteUrl}}/SitePages/Demo-Videos.aspx\">Watch videos →<\/a><\/p>"}]]}, {"Template": "ThreeColumn", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<h3>Agents &amp; Tools<\/h3><p>Daily Digest, the Email Filing Assistant and what we're building next, with how to start each one.<\/p><p><a href=\"{{siteUrl}}/SitePages/Agents-and-Tools.aspx\">See agents →<\/a><\/p>"}], [{"Type": "Text", "Html": "<h3>Use AI Responsibly<\/h3><p>Five habits for using Copilot on client work: what it can see, how to check it, and where it shouldn't go.<\/p><p><a href=\"{{siteUrl}}/SitePages/Use-AI-Responsibly.aspx\">Read the guidelines →<\/a><\/p>"}], [{"Type": "Text", "Html": "<h3>Share Feedback<\/h3><p>An idea for a prompt, a tip or an agent? Something not working? Tell us. We read every one.<\/p><p><a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">Give feedback →<\/a><\/p>"}]]}, {"Template": "TwoColumnLeft", "Emphasis": 0, "Columns": [[{"Type": "News"}], [{"Type": "Text", "Html": "<h3>This week's Friday tip<\/h3>"}, {"Type": "Hub", "Section": "latestTip", "List": "Friday Tips", "View": "Latest tip"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Text", "Html": "<h3>Featured prompts<\/h3><p>A few favorites to try this week. Open one to see how to use it.<\/p>"}, {"Type": "Hub", "Section": "featuredPrompts", "List": "Prompt Library", "View": "Featured"}]]}, {"Template": "OneColumn", "Emphasis": 2, "Columns": [[{"Type": "Text", "Html": "<p><strong>Copilot can make mistakes.<\/strong> Give its answers a quick check before you rely on them or send them on, and follow the firm's policies for client and confidential information. Questions? Ask the AI Working Group or <a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">send us feedback<\/a>.<\/p>"}]]}]}, {"Name": "Get-Started", "Title": "Get Started with Copilot", "Layout": "Article", "Sections": [{"Template": "TwoColumnLeft", "Emphasis": 0, "Columns": [[{"Type": "Text", "Html": "<h2>Your first five minutes<\/h2><ol><li><strong>Open Copilot Chat.<\/strong> Go to <a href=\"https://m365.cloud.microsoft/chat\">m365.cloud.microsoft/chat<\/a>, or select Copilot in Teams or Outlook.<\/li><li><strong>Try one prompt.<\/strong> Pick anything from the <a href=\"{{siteUrl}}/SitePages/Prompt-Library.aspx\">Prompt Library<\/a>, fill in the [brackets] and send it.<\/li><li><strong>Summarize a long email thread.<\/strong> In Outlook, open a long conversation and select Summary by Copilot.<\/li><li><strong>Turn on your Daily Digest.<\/strong> See <a href=\"{{siteUrl}}/SitePages/Agents-and-Tools.aspx\">Agents &amp; Tools<\/a>.<\/li><li><strong>Watch a two-minute video.<\/strong> Start with <a href=\"{{siteUrl}}/SitePages/Demo-Videos.aspx\">Demo Videos<\/a>.<\/li><\/ol><h2>Where Copilot lives<\/h2><table><tbody><tr><td><strong>App<\/strong><\/td><td><strong>Try this first<\/strong><\/td><\/tr><tr><td>Copilot Chat<\/td><td>Attach a document and ask for a summary with deadlines and dollar amounts.<\/td><\/tr><tr><td>Outlook<\/td><td>Summarize a thread, draft a reply, or get coaching on a sensitive email.<\/td><\/tr><tr><td>Word<\/td><td>Check defined terms and cross-references, or explain a provision in plain English.<\/td><\/tr><tr><td>Excel<\/td><td>Ask questions of a rent roll or deal list (format it as a table first).<\/td><\/tr><tr><td>Teams<\/td><td>Get a recap of a transcribed meeting with action items and owners.<\/td><\/tr><\/tbody><\/table>"}], [{"Type": "Text", "Html": "<h3>How to write a good prompt<\/h3><p>Give Copilot four things:<\/p><ul><li><strong>Goal:<\/strong> what you want (\"an open-issues list\").<\/li><li><strong>Context:<\/strong> the matter, the audience, why you need it.<\/li><li><strong>Source:<\/strong> the emails or files to use. Type / to pick them.<\/li><li><strong>Expectations:<\/strong> format, length, and what to do when it isn't sure (\"write not found rather than guessing\").<\/li><\/ul><p>Not sure how to ask? Tell Copilot what you want and ask it to write the prompt for you.<\/p>"}]]}]}, {"Name": "Prompt-Library", "Title": "Prompt Library", "Layout": "Article", "Sections": [{"Template": "TwoColumnLeft", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<p>Prompts that work at Cassin, written for our deals and our documents. Select a prompt to open it, copy the text into Copilot and fill in the [brackets]. Use the search box or filter by <strong>Category<\/strong>, <strong>Practice<\/strong> or <strong>Works in<\/strong>.<\/p>"}], [{"Type": "Text", "Html": "<p><strong>Have a prompt that works?<\/strong> Share it. It appears for everyone once the AI Working Group approves it.<\/p>"}, {"Type": "Button", "Label": "Submit a prompt", "Url": "{{siteUrl}}/Lists/PromptLibrary/NewForm.aspx"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Hub", "Section": "promptLibrary", "List": "Prompt Library", "View": "By category"}]]}]}, {"Name": "Friday-Tips", "Title": "Friday Tips", "Layout": "Article", "Sections": [{"Template": "OneColumn", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<p>One small thing to try each week, about five minutes each. Every tip is here, newest first, with the steps, the prompt to copy and a short video. Have an idea for a future tip? <a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">Tell us<\/a>.<\/p>"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Hub", "Section": "fridayTips", "List": "Friday Tips", "View": "All tips"}]]}]}, {"Name": "Demo-Videos", "Title": "Demo Videos", "Layout": "Article", "Sections": [{"Template": "OneColumn", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<p>Short walkthroughs, most under five minutes. Filter by <strong>App<\/strong> or <strong>Level<\/strong>. Videos recorded at Cassin (for example a Teams recording of a Working Group demo) are stored in the <a href=\"{{siteUrl}}/Recordings\">Recordings<\/a> library and listed here.<\/p>"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Hub", "Section": "videos", "List": "Demo Videos", "View": "By app"}]]}]}, {"Name": "Agents-and-Tools", "Title": "Agents & Tools", "Layout": "Article", "Sections": [{"Template": "OneColumn", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<p>Agents are Copilot helpers built for one job at Cassin. Each one works with your own sign-in and only sees what you can already see. The AI Working Group picks what we build next, so if there's a workflow you'd like help with, <a href=\"{{siteUrl}}/SitePages/Feedback.aspx\">suggest it<\/a>.<\/p>"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Hub", "Section": "agents", "List": "AI Agents", "View": "All agents"}]]}]}, {"Name": "Use-AI-Responsibly", "Title": "Use AI Responsibly", "Layout": "Article", "Sections": [{"Template": "TwoColumnLeft", "Emphasis": 0, "Columns": [[{"Type": "Text", "Html": "<h2>Five habits<\/h2><ol><li><strong>Use the firm's Copilot for client work.<\/strong> Microsoft 365 Copilot runs inside the firm's Microsoft 365 environment and only sees what you can already see. Don't paste client or matter information into public AI tools such as free ChatGPT or Gemini.<\/li><li><strong>Check before you rely.<\/strong> Click the citations. Compare figures, dates, names and section numbers against the source. Copilot can be confidently wrong.<\/li><li><strong>A lawyer reviews it before it leaves the firm.<\/strong> Anything going to a client, a lender or the other side gets attorney review, the same as work from a junior colleague.<\/li><li><strong>Ask it to say when it doesn't know.<\/strong> Add \"write not found rather than guessing\" to prompts that pull facts from documents.<\/li><li><strong>Keep the firm's rules.<\/strong> Follow the firm's policies for client and confidential information, records and ethical walls. AI doesn't change them.<\/li><\/ol>"}], [{"Type": "Text", "Html": "<h3>What Copilot can see<\/h3><p>Only email, chats, meetings and files that you already have permission to open. It doesn't give you access to anything new.<\/p><h3>Where your prompts go<\/h3><p>Microsoft doesn't use your prompts, responses or files to train its AI models.<\/p><h3>Not sure?<\/h3><p>Ask the AI Working Group before you try it on a live matter.<\/p>"}]]}]}, {"Name": "FAQ", "Title": "FAQ", "Layout": "Article", "Sections": [{"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Hub", "Section": "faq", "List": "AI FAQ", "View": "By topic"}]]}]}, {"Name": "Feedback", "Title": "Feedback", "Layout": "Article", "Sections": [{"Template": "TwoColumnLeft", "Emphasis": 1, "Columns": [[{"Type": "Text", "Html": "<h2>Tell us what you think<\/h2><p>Ideas for prompts, tips or agents, something that isn't working, or a win worth sharing: it all helps decide what we build next. Only you and the site owners can see what you submit.<\/p>"}, {"Type": "Button", "Label": "Share feedback", "Url": "{{siteUrl}}/Lists/HubFeedback/NewForm.aspx"}], [{"Type": "Text", "Html": "<h3>What happens next<\/h3><ul><li>The AI Working Group reviews new feedback each week.<\/li><li>You'll see the status change here: New, Reviewing, Planned, Done.<\/li><li>Good ideas become Friday tips, library prompts or agents.<\/li><\/ul>"}]]}, {"Template": "OneColumn", "Emphasis": 0, "Columns": [[{"Type": "Text", "Html": "<h3>Your feedback<\/h3>"}, {"Type": "Hub", "Section": "myFeedback", "List": "Hub Feedback", "View": "My feedback"}]]}]}], "siteUrl": "https://cassinllp.sharepoint.com/sites/AIHub"};
const ROUTES = { "Hub-Home": "home", "Get-Started": "start", "Prompt-Library": "prompts", "Friday-Tips": "tips",
  "Demo-Videos": "videos", "Agents-and-Tools": "agents", "Use-AI-Responsibly": "responsible", "FAQ": "faq", "Feedback": "feedback" };
const PAGE_BY_ROUTE = Object.fromEntries(DATA.pages.map(p => [ROUTES[p.Name], p]));
const NAV = [
  ["Home", "home"],
  ["Get Started", null, [["Get started with Copilot", "start"], ["Use AI responsibly", "responsible"], ["FAQ", "faq"]]],
  ["Prompt Library", "prompts"], ["Friday Tips", "tips"], ["Demo Videos", "videos"],
  ["Agents & Tools", "agents"], ["News", "news"], ["Feedback", "feedback"]
];
const myFeedback = [];
let promptFilter = { q: "", cat: "All" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

// Page HTML links point at SharePoint; send them to the matching preview route instead.
function localize(html) {
  return html
    .replace(/\{\{siteUrl\}\}\/SitePages\/([\w-]+)\.aspx/g, (_, n) => "#/" + (ROUTES[n] || "home"))
    .replace(/\{\{siteUrl\}\}\/Lists\/PromptLibrary\/NewForm\.aspx/g, "#/prompts?new")
    .replace(/\{\{siteUrl\}\}\/Lists\/HubFeedback\/NewForm\.aspx/g, "#/feedback?new")
    .replace(/\{\{siteUrl\}\}\/Recordings/g, "#/videos");
}

function renderNav(route) {
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(([label, r, kids]) => {
    if (!kids) return `<a href="#/${r}" class="${route === r ? "on" : ""}">${esc(label)}</a>`;
    const on = kids.some(k => k[1] === route);
    return `<div class="dd ${on ? "on" : ""}"><button type="button" aria-haspopup="true" onclick="this.parentNode.classList.toggle('open')">${esc(label)} ▾</button>
      <div class="dd-menu">${kids.map(([l, kr]) => `<a href="#/${kr}">${esc(l)}</a>`).join("")}</div></div>`;
  }).join("");
}
document.addEventListener("click", e => { if (!e.target.closest(".dd")) document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open")); });

// ---- list renderers (stand-ins for SharePoint list web parts) ----
function promptCard(p) {
  return `<article class="card">
    <h4>${esc(p.Title)}</h4>
    <div class="meta"><span class="chip">${esc(p.Category)}</span>${p.WorksIn.map(w => `<span class="chip" style="background:var(--sand-2);color:var(--muted)">${esc(w)}</span>`).join("")}</div>
    <p class="prompt">${esc(p.Prompt)}</p>
    <details class="more"><summary>How to use it</summary><p>${esc(p.HowToUse)}</p><p><strong>Check before you rely on it:</strong> ${esc(p.WatchOuts)}</p></details>
    <div class="actions"><button class="btn sm" type="button" data-copy="${esc(p.Prompt)}">Copy prompt</button><span style="font-size:13px;color:var(--faint)">${esc(p.Practice)}</span></div>
  </article>`;
}
function promptLibrary() {
  const cats = ["All", ...new Set(DATA.prompts.map(p => p.Category))];
  const q = promptFilter.q.toLowerCase();
  const rows = DATA.prompts.filter(p => (promptFilter.cat === "All" || p.Category === promptFilter.cat) &&
    (!q || (p.Title + " " + p.Prompt + " " + p.Practice).toLowerCase().includes(q)));
  const groups = {};
  rows.forEach(p => (groups[p.Category] ||= []).push(p));
  return `<div class="toolbar"><input type="search" id="pq" placeholder="Search prompts (try: title, loan, email)" value="${esc(promptFilter.q)}" aria-label="Search prompts"></div>
    <div class="toolbar">${cats.map(c => `<button type="button" class="filter ${c === promptFilter.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div id="plist">${rows.length ? Object.entries(groups).map(([g, ps]) => `<h3 class="group-h">${esc(g)} (${ps.length})</h3><div class="grid">${ps.map(promptCard).join("")}</div>`).join("")
      : `<div class="empty">No prompts match. Try another word, or submit one.</div>`}</div>`;
}
function tipCard(t) {
  const steps = t.Steps.split("\n").map(s => s.replace(/^\d+\.\s*/, ""));
  return `<article class="tip"><div class="num"><span>Tip</span><b>${t.TipNumber}</b><span>${new Date(t.TipDate + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span></div>
    <div><div class="eyebrow">${fmtDate(t.TipDate)} · ${esc(t.WorksWith)}</div><h3>${esc(t.Title)}</h3><p>${esc(t.WhyItHelps)}</p>
    <h5>Try it</h5><ol>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h5>Copy and paste this into Copilot</h5><p class="prompt">${esc(t.Prompt)}</p>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-copy="${esc(t.Prompt)}">Copy prompt</button>
    <a class="btn sm ghost" href="${esc(t.VideoLink)}" target="_blank" rel="noopener">▶ Watch: ${esc(t.VideoTitle)}</a>
    <a class="btn sm ghost" href="${esc(t.ArticleLink)}" target="_blank" rel="noopener">Read more</a></div></div></article>`;
}
const sortedTips = () => [...DATA.tips].sort((a, b) => b.TipDate.localeCompare(a.TipDate));
function latestTip() {
  const t = sortedTips()[0];
  return `<div class="compact"><div class="date">Tip ${t.TipNumber} · ${fmtDate(t.TipDate)}</div><h4 style="font-size:18px;margin:4px 0 8px">${esc(t.Title)}</h4>
    <p style="font-size:15px">${esc(t.WhyItHelps)}</p><p class="prompt" style="font-size:14px">${esc(t.Prompt)}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-copy="${esc(t.Prompt)}">Copy prompt</button><a class="btn sm ghost" href="${esc(t.VideoLink)}" target="_blank" rel="noopener">▶ Watch</a></div>
    <p style="margin:12px 0 0;font-size:14px"><a href="#/tips">See all tips →</a></p></div>`;
}
function videos() {
  const groups = {};
  DATA.videos.forEach(v => (groups[v.App] ||= []).push(v));
  return Object.entries(groups).map(([app, vs]) => `<h3 class="group-h">${esc(app)}</h3><div class="grid">${vs.map(v => `<article class="card">
    <div class="meta"><span class="chip">${esc(v.Level)}</span><span class="chip" style="background:var(--sand-2);color:var(--muted)">From ${esc(v.Source)}</span></div>
    <h4>${esc(v.Title)}</h4><p style="color:var(--muted);font-size:15px">${esc(v.Description)}</p>
    <div class="actions"><a class="btn sm" href="${esc(v.VideoLink)}" target="_blank" rel="noopener">▶ Watch</a></div></article>`).join("")}</div>`).join("");
}
function agents() {
  return `<div class="grid">${DATA.agents.map(a => `<article class="card"><div class="meta"><span class="pill p-${esc(a.AgentStatus)}">${esc(a.AgentStatus)}</span></div>
    <h4>${esc(a.Title)}</h4><p style="font-size:15px">${esc(a.WhatItDoes)}</p>
    <p style="font-size:15px;color:var(--muted)"><strong style="color:var(--navy)">How to start:</strong> ${esc(a.HowToStart)}</p>
    <p style="font-size:13px;color:var(--faint);margin:auto 0 0">Champion: ${esc(a.Champion || "to be named")}</p></article>`).join("")}</div>`;
}
function faq() {
  const groups = {};
  DATA.faq.forEach(f => (groups[f.Topic] ||= []).push(f));
  return Object.entries(groups).map(([t, qs]) => `<h3 class="group-h">${esc(t)}</h3>${qs.map(f => `<details class="faq"><summary>${esc(f.Title)}</summary><p>${esc(f.Answer)}</p></details>`).join("")}`).join("");
}
function feedbackTable() {
  if (!myFeedback.length) return `<div class="empty">You haven't sent any feedback yet.</div>`;
  return `<table class="list"><thead><tr><th>Summary</th><th>Type</th><th>About</th><th>Status</th><th>Our response</th></tr></thead><tbody>${myFeedback.map(f =>
    `<tr><td>${esc(f.Summary)}</td><td>${esc(f.Type)}</td><td>${esc(f.About)}</td><td><span class="pill p-New">New</span></td><td style="color:var(--faint)">–</td></tr>`).join("")}</tbody></table>`;
}
function newsList() {
  return `<div class="news">${DATA.news.map(n => `<a class="item" href="#/news/${esc(n.Name)}"><div class="thumb"></div><div><h4>${esc(n.Title)}</h4><p>${esc(n.Description)}</p><p style="font-size:13px;margin-top:6px">AI Working Group</p></div></a>`).join("")}</div>`;
}
const LISTS = {
  "Prompt Library|By category": promptLibrary,
  "Prompt Library|Featured": () => `<div class="grid">${DATA.prompts.filter(p => p.Featured).slice(0, 6).map(promptCard).join("")}</div><p style="margin-top:14px"><a href="#/prompts">See all ${DATA.prompts.length} prompts →</a></p>`,
  "Friday Tips|All tips": () => sortedTips().map(tipCard).join(""),
  "Friday Tips|Latest tip": latestTip,
  "Demo Videos|By app": videos,
  "AI Agents|All agents": agents,
  "AI FAQ|By topic": faq,
  "Hub Feedback|My feedback": feedbackTable
};

function renderPart(part) {
  switch (part.Type) {
    case "Text": return `<div class="rte">${localize(part.Html)}</div>`;
    case "Hub":
    case "List": return `<div class="lwp">${(LISTS[part.List + "|" + part.View] || (() => ""))()}</div>`;
    case "News": return `<div><h3>News</h3>${newsList()}<p style="margin-top:12px"><a href="#/news">See all news →</a></p></div>`;
    case "Button": return `<div><a class="btn" href="${localize(part.Url)}">${esc(part.Label)}</a></div>`;
  }
  return "";
}
function renderPage(page) {
  const title = page.Layout === "Home" ? "" : `<div class="page-title"><div class="in"><div class="eyebrow">Cassin AI Hub</div><h1>${esc(page.Title)}</h1></div></div>`;
  return title + page.Sections.map(s => `<section class="sec e${s.Emphasis}"><div class="in t-${s.Template}">${s.Columns.map(col =>
    `<div class="col">${col.map(renderPart).join("")}</div>`).join("")}</div></section>`).join("");
}
function renderNews(name) {
  if (!name) return `<div class="page-title"><div class="in"><div class="eyebrow">Cassin AI Hub</div><h1>News</h1></div></div><section class="sec"><div class="in t-OneColumn"><div class="col">${newsList()}</div></div></section>`;
  const n = DATA.news.find(x => x.Name === name) || DATA.news[0];
  return `<div class="page-title"><div class="in"><div class="eyebrow">News · AI Working Group</div><h1>${esc(n.Title)}</h1></div></div>
    <section class="sec"><div class="in t-OneColumn"><div class="col article rte">${localize(n.Html)}<p><a href="#/news">← All news</a></p></div></div></section>`;
}

function route() {
  const [path, query] = (location.hash.replace(/^#\/?/, "") || "home").split("?");
  const [r, arg] = path.split("/");
  renderNav(r === "news" ? "news" : r);
  const main = document.getElementById("main");
  main.innerHTML = r === "news" ? renderNews(arg) : renderPage(PAGE_BY_ROUTE[r] || PAGE_BY_ROUTE.home);
  document.title = (r === "home" ? "Cassin AI Hub" : ((PAGE_BY_ROUTE[r] || {}).Title || "News") + " · Cassin AI Hub") + " (preview)";
  bindPrompts();
  if (query === "new") openPanel(r === "prompts" ? "prompt" : "feedback");
  window.scrollTo(0, 0);
}
function bindPrompts() {
  const q = document.getElementById("pq");
  if (q) q.addEventListener("input", () => { promptFilter.q = q.value; redrawPrompts(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { promptFilter.cat = b.dataset.cat; redrawPrompts(); });
}
function redrawPrompts() {
  const wrap = document.getElementById("pq").closest(".lwp");
  const pos = document.getElementById("pq").selectionStart;
  wrap.innerHTML = promptLibrary();
  bindPrompts();
  const q = document.getElementById("pq"); q.focus(); q.setSelectionRange(pos, pos);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Prompt copied. Paste it into Copilot."), () => toast("Select the prompt text and copy it."));
});

// ---- forms (preview only) ----
const opts = a => a.map(o => `<option>${esc(o)}</option>`).join("");
const FORMS = {
  prompt: { title: "Submit a prompt", html: `
    <label>Prompt name</label><input type="text" name="Summary" required>
    <label>Prompt <span class="hint">Use [brackets] for the parts people fill in.</span></label><textarea name="Prompt" required></textarea>
    <label>Category</label><select name="Category">${opts([...new Set(DATA.prompts.map(p => p.Category))])}</select>
    <label>Practice</label><select name="Practice">${opts(["All practices", "Agency lending", "Balance sheet & bridge lending", "CMBS", "Affordable housing", "Leasing", "Restructuring & workouts", "Private client", "Firm operations"])}</select>
    <label>Works in</label><div class="checks">${["Copilot Chat", "Outlook", "Word", "Excel", "PowerPoint", "Teams"].map(a => `<label><input type="checkbox"> ${a}</label>`).join("")}</div>
    <label>How to use it</label><textarea name="How" style="min-height:70px"></textarea>
    <label>Check before you rely on it</label><textarea name="Check" style="min-height:70px"></textarea>
    <div class="foot"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="closePanel()">Cancel</button></div>` },
  feedback: { title: "Share feedback", html: `
    <label>Summary</label><input type="text" name="Summary" required>
    <label>Type</label><select name="Type">${opts(["Idea for a prompt or tip", "Idea for an agent or workflow", "Something isn't working", "A win worth sharing", "Question", "Other"])}</select>
    <label>About</label><select name="About">${opts(["Copilot in general", "Daily Digest", "Email Filing Assistant", "Friday Tips", "Prompt Library", "This site", "Other"])}</select>
    <label>Details</label><textarea name="Details" required></textarea>
    <div class="checks"><label><input type="checkbox" checked> OK to contact me about this?</label></div>
    <div class="foot"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="closePanel()">Cancel</button></div>` }
};
let panelKind = null;
function openPanel(kind) {
  panelKind = kind;
  document.getElementById("panel-title").textContent = FORMS[kind].title;
  document.getElementById("panel-form").innerHTML = FORMS[kind].html;
  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  setTimeout(() => document.querySelector("#panel-form input, #panel-form textarea").focus(), 50);
}
function closePanel() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  if (location.hash.includes("?new")) history.replaceState(null, "", location.hash.split("?")[0]);
}
function submitPanel(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  if (panelKind === "feedback") {
    myFeedback.unshift({ Summary: f.get("Summary"), Type: f.get("Type"), About: f.get("About") });
    closePanel(); route();
    toast("Thanks! In SharePoint this saves to Hub Feedback. (Preview: not saved.)");
  } else {
    closePanel();
    toast("Submitted for approval. It appears once the AI Working Group approves it. (Preview: not saved.)");
  }
  return false;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
window.addEventListener("hashchange", route);
route();
</script>
