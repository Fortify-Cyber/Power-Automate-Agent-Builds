<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassin AI Hub (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Roboto+Serif:opsz,wght@8..144,300;8..144,400;8..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #021D3C;
    --primary: #00426C;
    --primary-dark: #003251;
    --blue: #0077CE;
    --sky: #4DD8FF;
    --sand: #EFE7DF;
    --sand-2: #F2ECE6;
    --sand-line: #DDD3CA;
    --soft: #EFF3F6;
    --soft-line: #C7D5DF;
    --prompt-bg: #F7F9FC;
    --text: #021D3C;
    --muted: #3B5068;
    --faint: #8B97A5;
    --line: #E4E1DD;
    --white: #FFFFFF;
    --live: #D7F0DD; --pilot: #D6E9F8; --next: #EFE7DF; --planned: #E4DCF5;
    --serif: "Roboto Serif", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--white); color: var(--text); font: 16px/1.55 var(--sans); }
  a { color: var(--blue); }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.2; margin: 0 0 .5em; color: var(--navy); }
  h2 { font-size: 30px; font-weight: 300; }
  h3 { font-size: 21px; }
  p { margin: 0 0 .8em; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Microsoft 365 suite bar */
  .suite { height: 48px; background: #1F1F1F; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 15px; }
  .waffle { width: 18px; height: 18px; display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; }
  .waffle i { width: 4px; height: 4px; background: #fff; display: block; }
  .suite .search { margin-left: auto; margin-right: auto; width: min(460px, 45vw); height: 32px; border-radius: 4px; background: #fff; color: #616161; display: flex; align-items: center; padding: 0 12px; font-size: 14px; }
  .suite .me { width: 30px; height: 30px; border-radius: 50%; background: var(--sky); color: var(--navy); font-weight: 600; font-size: 13px; display: grid; place-items: center; }

  /* Site header (Strong emphasis) */
  header.site { background: var(--primary); color: #fff; }
  .site-top { max-width: 1240px; margin: 0 auto; padding: 18px 24px 10px; display: flex; align-items: center; gap: 16px; }
  .site-top svg { width: 52px; height: 52px; flex: none; }
  .site-name { font-family: var(--serif); font-size: 26px; font-weight: 300; letter-spacing: .2px; }
  .site-sub { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #C7D5DF; }
  nav.top { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.top::-webkit-scrollbar { display: none; }
  nav.top a, nav.top .dd > button { color: #fff; text-decoration: none; padding: 10px 12px 12px; white-space: nowrap; font-size: 15px; border: 0; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
  nav.top a:hover, nav.top .dd > button:hover { background: rgba(255,255,255,.08); }
  nav.top a.on, nav.top .dd.on > button { border-bottom-color: var(--sky); }
  .dd { position: relative; }
  .dd-menu { display: none; position: absolute; left: 0; top: 100%; background: #fff; min-width: 230px; box-shadow: 0 6px 24px rgba(2,29,60,.18); z-index: 20; padding: 6px 0; }
  .dd.open .dd-menu { display: block; }
  .dd-menu a { display: block; color: var(--text) !important; padding: 9px 16px !important; border: 0 !important; }
  .dd-menu a:hover { background: var(--soft) !important; }

  /* Page title (ColorBlock header) */
  .page-title { background: var(--navy); color: #fff; }
  .page-title .in { max-width: 1240px; margin: 0 auto; padding: 34px 24px 30px; }
  .page-title h1 { color: #fff; font-size: 40px; font-weight: 300; margin: 0; }
  .eyebrow { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .page-title .eyebrow { color: #9FB6C9; }

  /* Sections and emphasis */
  .sec { padding: 28px 0; }
  .sec.e1 { background: var(--sand-2); }
  .sec.e2 { background: var(--soft); }
  .sec.e3 { background: var(--primary); color: #fff; }
  .sec.e3 h2, .sec.e3 h3, .sec.e3 a { color: #fff; }
  .sec.e3 p { color: #E3ECF3; font-size: 18px; max-width: 760px; }
  .sec .in { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: grid; gap: 32px; }
  .t-OneColumn { grid-template-columns: 1fr; }
  .t-TwoColumn { grid-template-columns: 1fr 1fr; }
  .t-ThreeColumn { grid-template-columns: 1fr 1fr 1fr; }
  .t-TwoColumnLeft { grid-template-columns: 2fr 1fr; }
  .t-TwoColumnRight { grid-template-columns: 1fr 2fr; }
  .col > * + * { margin-top: 14px; }
  .sec.e1 + .sec.e1 { padding-top: 0; }
  .t-ThreeColumn .col { border-top: 3px solid var(--primary); padding-top: 16px; }
  .sec.e3 .t-ThreeColumn .col { border-top-color: var(--sky); }
  .rte ol, .rte ul { padding-left: 22px; margin: 0 0 1em; }
  .rte li { margin-bottom: 6px; }
  .rte table { border-collapse: collapse; width: 100%; margin: 6px 0 16px; font-size: 15px; }
  .rte td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
  .rte tr:first-child td { background: var(--sand-2); }

  /* Buttons and chips */
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; border: 0; padding: 9px 18px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--soft-line); }
  .btn.ghost:hover { background: var(--soft); }
  .btn.sm { padding: 5px 12px; font-size: 14px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 12px; background: var(--soft); color: var(--primary); font-weight: 600; margin: 0 4px 4px 0; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 600; color: var(--navy); }
  .p-Live, .p-Done { background: var(--live); } .p-Pilot, .p-Reviewing { background: var(--pilot); }
  .p-Up.next, .p-New { background: var(--next); } .p-Planned { background: var(--planned); } .p-Proposed { background: #eee; }

  /* Prompt cards */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: #fff; border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; }
  .card h4 { font-size: 18px; margin-bottom: 8px; }
  .card .meta { margin-bottom: 10px; }
  .prompt { border-left: 4px solid var(--primary); background: var(--prompt-bg); padding: 10px 14px; font-style: italic; white-space: pre-wrap; font-size: 15px; margin: 0 0 12px; }
  .card .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  details.more { font-size: 14.5px; color: var(--muted); margin-bottom: 12px; }
  details.more summary { cursor: pointer; color: var(--primary); font-weight: 600; }
  details.more p { margin: 6px 0 0; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .toolbar input { flex: 1 1 260px; padding: 9px 12px; border: 1px solid var(--soft-line); font: inherit; }
  .filter { border: 1px solid var(--soft-line); background: #fff; padding: 5px 12px; cursor: pointer; font-size: 14px; color: var(--primary); }
  .filter.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .group-h { font-family: var(--sans); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 26px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .group-h:first-child { margin-top: 0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--sand-line); }

  /* Tips */
  .tip { display: grid; grid-template-columns: 92px 1fr; gap: 20px; background: #fff; border: 1px solid var(--line); padding: 20px; margin-bottom: 16px; }
  .tip .num { background: var(--primary); color: #fff; text-align: center; padding: 10px 6px; height: fit-content; }
  .tip .num b { display: block; font-family: var(--serif); font-size: 34px; font-weight: 300; line-height: 1; }
  .tip .num span { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .tip ol { padding-left: 20px; margin: 4px 0 12px; }
  .tip h5 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  .compact { background: #fff; border: 1px solid var(--line); padding: 16px 18px; }
  .compact .date { font-size: 13px; color: var(--muted); }

  /* News */
  .news { display: grid; gap: 16px; }
  .news a.item { display: grid; grid-template-columns: 150px 1fr; gap: 16px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .news .thumb { background: linear-gradient(135deg, var(--primary), var(--navy)); min-height: 92px; position: relative; }
  .news .thumb::after { content: ""; position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; background: var(--sky); }
  .news h4 { font-size: 19px; margin-bottom: 4px; }
  .news a.item:hover h4 { color: var(--blue); }
  .news p { color: var(--muted); font-size: 15px; margin: 0; }
  .article { max-width: 760px; }

  /* FAQ */
  details.faq { border-bottom: 1px solid var(--line); padding: 12px 0; }
  details.faq summary { cursor: pointer; font-weight: 600; font-size: 17px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  details.faq summary::after { content: "+"; color: var(--primary); font-size: 22px; line-height: 1; }
  details.faq[open] summary::after { content: "–"; }
  details.faq p { margin: 8px 0 4px; color: var(--muted); max-width: 820px; }

  /* Table */
  table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.list th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 8px; }
  table.list td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: top; }

  /* Footer */
  footer.site { background: var(--primary); color: #fff; margin-top: 0; }
  footer.site .in { max-width: 1240px; margin: 0 auto; padding: 22px 24px; display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  footer.site a { color: #fff; text-decoration: none; font-size: 14px; }
  footer.site .name { font-family: var(--serif); font-size: 17px; margin-right: auto; }

  /* Modal, toast, preview tag */
  .scrim { position: fixed; inset: 0; background: rgba(2,29,60,.45); display: none; z-index: 50; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: #fff; z-index: 51; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  .panel.open { transform: none; } .panel.open ~ .scrim, .scrim.open { display: block; }
  .panel header { padding: 20px 24px 8px; display: flex; justify-content: space-between; align-items: start; }
  .panel header h3 { margin: 0; }
  .panel .x { border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); }
  .panel form { padding: 8px 24px 24px; overflow-y: auto; }
  .panel label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
  .panel .hint { font-weight: 400; color: var(--muted); }
  .panel input[type=text], .panel select, .panel textarea { width: 100%; padding: 8px 10px; border: 1px solid #8a8886; font: inherit; }
  .panel textarea { min-height: 110px; }
  .panel .checks label { display: inline-flex; gap: 6px; font-weight: 400; margin: 4px 14px 0 0; }
  .panel .foot { display: flex; gap: 10px; margin-top: 22px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 18px; opacity: 0; transition: .2s; z-index: 60; font-size: 15px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .tag { font-size: 12px; color: #1F1F1F; background: var(--sky); padding: 2px 8px; font-weight: 600; }

  @media (max-width: 860px) {
    .t-TwoColumn, .t-ThreeColumn, .t-TwoColumnLeft, .t-TwoColumnRight { grid-template-columns: 1fr; }
    .sec .in, .site-top, .page-title .in, footer.site .in { padding-left: 16px; padding-right: 16px; }
    .page-title h1 { font-size: 30px; }
    .suite .search { display: none; }
    .tip { grid-template-columns: 1fr; }
    .tip .num { display: flex; gap: 10px; align-items: baseline; justify-content: flex-start; padding: 8px 12px; }
    .tip .num b { font-size: 24px; }
    .news a.item { grid-template-columns: 90px 1fr; }
    .grid { grid-template-columns: 1fr; }
    .site-name { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="suite" aria-hidden="true"><span class="waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span>SharePoint</span><span class="tag">Design preview · nothing is saved</span><span class="search">Search this site</span><span class="me">CS</span></div>
<header class="site">
  <div class="site-top"><!--__LOGO__--><div><div class="site-name">Cassin AI Hub</div><div class="site-sub">Cassin &amp; Cassin LLP</div></div></div>
  <nav class="top" id="nav"></nav>
</header>
<main id="main"></main>
<footer class="site"><div class="in"><span class="name">Cassin &amp; Cassin LLP · AI Hub</span><a href="https://m365.cloud.microsoft/chat" target="_blank" rel="noopener">Copilot Chat</a><a href="#/responsible">Use AI responsibly</a><a href="#/feedback">Feedback</a></div></footer>

<aside class="panel" id="panel" aria-modal="true" role="dialog"><header><h3 id="panel-title"></h3><button class="x" onclick="closePanel()" aria-label="Close">×</button></header><form id="panel-form" onsubmit="return submitPanel(event)"></form></aside>
<div class="scrim" id="scrim" onclick="closePanel()"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = /*__DATA__*/null;
const ROUTES = { "Hub-Home": "home", "Get-Started": "start", "Prompt-Library": "prompts", "Friday-Tips": "tips",
  "Demo-Videos": "videos", "Agents-and-Tools": "agents", "Use-AI-Responsibly": "responsible", "FAQ": "faq", "Feedback": "feedback" };
const PAGE_BY_ROUTE = Object.fromEntries(DATA.pages.map(p => [ROUTES[p.Name], p]));
const NAV = [
  ["Home", "home"],
  ["Get Started", null, [["Get started with Copilot", "start"], ["Use AI responsibly", "responsible"], ["FAQ", "faq"]]],
  ["Prompt Library", "prompts"], ["Friday Tips", "tips"], ["Demo Videos", "videos"],
  ["Agents & Tools", "agents"], ["News", "news"], ["Feedback", "feedback"]
];
const myFeedback = [];
let promptFilter = { q: "", cat: "All" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

// Page HTML links point at SharePoint; send them to the matching preview route instead.
function localize(html) {
  return html
    .replace(/\{\{siteUrl\}\}\/SitePages\/([\w-]+)\.aspx/g, (_, n) => "#/" + (ROUTES[n] || "home"))
    .replace(/\{\{siteUrl\}\}\/Lists\/PromptLibrary\/NewForm\.aspx/g, "#/prompts?new")
    .replace(/\{\{siteUrl\}\}\/Lists\/HubFeedback\/NewForm\.aspx/g, "#/feedback?new")
    .replace(/\{\{siteUrl\}\}\/Recordings/g, "#/videos");
}

function renderNav(route) {
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(([label, r, kids]) => {
    if (!kids) return `<a href="#/${r}" class="${route === r ? "on" : ""}">${esc(label)}</a>`;
    const on = kids.some(k => k[1] === route);
    return `<div class="dd ${on ? "on" : ""}"><button type="button" aria-haspopup="true" onclick="this.parentNode.classList.toggle('open')">${esc(label)} ▾</button>
      <div class="dd-menu">${kids.map(([l, kr]) => `<a href="#/${kr}">${esc(l)}</a>`).join("")}</div></div>`;
  }).join("");
}
document.addEventListener("click", e => { if (!e.target.closest(".dd")) document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open")); });

// ---- list renderers (stand-ins for SharePoint list web parts) ----
function promptCard(p) {
  return `<article class="card">
    <h4>${esc(p.Title)}</h4>
    <div class="meta"><span class="chip">${esc(p.Category)}</span>${p.WorksIn.map(w => `<span class="chip" style="background:var(--sand-2);color:var(--muted)">${esc(w)}</span>`).join("")}</div>
    <p class="prompt">${esc(p.Prompt)}</p>
    <details class="more"><summary>How to use it</summary><p>${esc(p.HowToUse)}</p><p><strong>Check before you rely on it:</strong> ${esc(p.WatchOuts)}</p></details>
    <div class="actions"><button class="btn sm" type="button" data-copy="${esc(p.Prompt)}">Copy prompt</button><span style="font-size:13px;color:var(--faint)">${esc(p.Practice)}</span></div>
  </article>`;
}
function promptLibrary() {
  const cats = ["All", ...new Set(DATA.prompts.map(p => p.Category))];
  const q = promptFilter.q.toLowerCase();
  const rows = DATA.prompts.filter(p => (promptFilter.cat === "All" || p.Category === promptFilter.cat) &&
    (!q || (p.Title + " " + p.Prompt + " " + p.Practice).toLowerCase().includes(q)));
  const groups = {};
  rows.forEach(p => (groups[p.Category] ||= []).push(p));
  return `<div class="toolbar"><input type="search" id="pq" placeholder="Search prompts (try: title, loan, email)" value="${esc(promptFilter.q)}" aria-label="Search prompts"></div>
    <div class="toolbar">${cats.map(c => `<button type="button" class="filter ${c === promptFilter.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div id="plist">${rows.length ? Object.entries(groups).map(([g, ps]) => `<h3 class="group-h">${esc(g)} (${ps.length})</h3><div class="grid">${ps.map(promptCard).join("")}</div>`).join("")
      : `<div class="empty">No prompts match. Try another word, or submit one.</div>`}</div>`;
}
function tipCard(t) {
  const steps = t.Steps.split("\n").map(s => s.replace(/^\d+\.\s*/, ""));
  return `<article class="tip"><div class="num"><span>Tip</span><b>${t.TipNumber}</b><span>${new Date(t.TipDate + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span></div>
    <div><div class="eyebrow">${fmtDate(t.TipDate)} · ${esc(t.WorksWith)}</div><h3>${esc(t.Title)}</h3><p>${esc(t.WhyItHelps)}</p>
    <h5>Try it</h5><ol>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h5>Copy and paste this into Copilot</h5><p class="prompt">${esc(t.Prompt)}</p>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-copy="${esc(t.Prompt)}">Copy prompt</button>
    <a class="btn sm ghost" href="${esc(t.VideoLink)}" target="_blank" rel="noopener">▶ Watch: ${esc(t.VideoTitle)}</a>
    <a class="btn sm ghost" href="${esc(t.ArticleLink)}" target="_blank" rel="noopener">Read more</a></div></div></article>`;
}
const sortedTips = () => [...DATA.tips].sort((a, b) => b.TipDate.localeCompare(a.TipDate));
function latestTip() {
  const t = sortedTips()[0];
  return `<div class="compact"><div class="date">Tip ${t.TipNumber} · ${fmtDate(t.TipDate)}</div><h4 style="font-size:18px;margin:4px 0 8px">${esc(t.Title)}</h4>
    <p style="font-size:15px">${esc(t.WhyItHelps)}</p><p class="prompt" style="font-size:14px">${esc(t.Prompt)}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-copy="${esc(t.Prompt)}">Copy prompt</button><a class="btn sm ghost" href="${esc(t.VideoLink)}" target="_blank" rel="noopener">▶ Watch</a></div>
    <p style="margin:12px 0 0;font-size:14px"><a href="#/tips">See all tips →</a></p></div>`;
}
function videos() {
  const groups = {};
  DATA.videos.forEach(v => (groups[v.App] ||= []).push(v));
  return Object.entries(groups).map(([app, vs]) => `<h3 class="group-h">${esc(app)}</h3><div class="grid">${vs.map(v => `<article class="card">
    <div class="meta"><span class="chip">${esc(v.Level)}</span><span class="chip" style="background:var(--sand-2);color:var(--muted)">From ${esc(v.Source)}</span></div>
    <h4>${esc(v.Title)}</h4><p style="color:var(--muted);font-size:15px">${esc(v.Description)}</p>
    <div class="actions"><a class="btn sm" href="${esc(v.VideoLink)}" target="_blank" rel="noopener">▶ Watch</a></div></article>`).join("")}</div>`).join("");
}
function agents() {
  return `<div class="grid">${DATA.agents.map(a => `<article class="card"><div class="meta"><span class="pill p-${esc(a.AgentStatus)}">${esc(a.AgentStatus)}</span></div>
    <h4>${esc(a.Title)}</h4><p style="font-size:15px">${esc(a.WhatItDoes)}</p>
    <p style="font-size:15px;color:var(--muted)"><strong style="color:var(--navy)">How to start:</strong> ${esc(a.HowToStart)}</p>
    <p style="font-size:13px;color:var(--faint);margin:auto 0 0">Champion: ${esc(a.Champion || "to be named")}</p></article>`).join("")}</div>`;
}
function faq() {
  const groups = {};
  DATA.faq.forEach(f => (groups[f.Topic] ||= []).push(f));
  return Object.entries(groups).map(([t, qs]) => `<h3 class="group-h">${esc(t)}</h3>${qs.map(f => `<details class="faq"><summary>${esc(f.Title)}</summary><p>${esc(f.Answer)}</p></details>`).join("")}`).join("");
}
function feedbackTable() {
  if (!myFeedback.length) return `<div class="empty">You haven't sent any feedback yet.</div>`;
  return `<table class="list"><thead><tr><th>Summary</th><th>Type</th><th>About</th><th>Status</th><th>Our response</th></tr></thead><tbody>${myFeedback.map(f =>
    `<tr><td>${esc(f.Summary)}</td><td>${esc(f.Type)}</td><td>${esc(f.About)}</td><td><span class="pill p-New">New</span></td><td style="color:var(--faint)">–</td></tr>`).join("")}</tbody></table>`;
}
function newsList() {
  return `<div class="news">${DATA.news.map(n => `<a class="item" href="#/news/${esc(n.Name)}"><div class="thumb"></div><div><h4>${esc(n.Title)}</h4><p>${esc(n.Description)}</p><p style="font-size:13px;margin-top:6px">AI Working Group</p></div></a>`).join("")}</div>`;
}
const LISTS = {
  "Prompt Library|By category": promptLibrary,
  "Prompt Library|Featured": () => `<div class="grid">${DATA.prompts.filter(p => p.Featured).slice(0, 6).map(promptCard).join("")}</div><p style="margin-top:14px"><a href="#/prompts">See all ${DATA.prompts.length} prompts →</a></p>`,
  "Friday Tips|All tips": () => sortedTips().map(tipCard).join(""),
  "Friday Tips|Latest tip": latestTip,
  "Demo Videos|By app": videos,
  "AI Agents|All agents": agents,
  "AI FAQ|By topic": faq,
  "Hub Feedback|My feedback": feedbackTable
};

function renderPart(part) {
  switch (part.Type) {
    case "Text": return `<div class="rte">${localize(part.Html)}</div>`;
    case "List": return `<div class="lwp">${(LISTS[part.List + "|" + part.View] || (() => ""))()}</div>`;
    case "News": return `<div><h3>News</h3>${newsList()}<p style="margin-top:12px"><a href="#/news">See all news →</a></p></div>`;
    case "Button": return `<div><a class="btn" href="${localize(part.Url)}">${esc(part.Label)}</a></div>`;
  }
  return "";
}
function renderPage(page) {
  const title = page.Layout === "Home" ? "" : `<div class="page-title"><div class="in"><div class="eyebrow">Cassin AI Hub</div><h1>${esc(page.Title)}</h1></div></div>`;
  return title + page.Sections.map(s => `<section class="sec e${s.Emphasis}"><div class="in t-${s.Template}">${s.Columns.map(col =>
    `<div class="col">${col.map(renderPart).join("")}</div>`).join("")}</div></section>`).join("");
}
function renderNews(name) {
  if (!name) return `<div class="page-title"><div class="in"><div class="eyebrow">Cassin AI Hub</div><h1>News</h1></div></div><section class="sec"><div class="in t-OneColumn"><div class="col">${newsList()}</div></div></section>`;
  const n = DATA.news.find(x => x.Name === name) || DATA.news[0];
  return `<div class="page-title"><div class="in"><div class="eyebrow">News · AI Working Group</div><h1>${esc(n.Title)}</h1></div></div>
    <section class="sec"><div class="in t-OneColumn"><div class="col article rte">${localize(n.Html)}<p><a href="#/news">← All news</a></p></div></div></section>`;
}

function route() {
  const [path, query] = (location.hash.replace(/^#\/?/, "") || "home").split("?");
  const [r, arg] = path.split("/");
  renderNav(r === "news" ? "news" : r);
  const main = document.getElementById("main");
  main.innerHTML = r === "news" ? renderNews(arg) : renderPage(PAGE_BY_ROUTE[r] || PAGE_BY_ROUTE.home);
  document.title = (r === "home" ? "Cassin AI Hub" : ((PAGE_BY_ROUTE[r] || {}).Title || "News") + " · Cassin AI Hub") + " (preview)";
  bindPrompts();
  if (query === "new") openPanel(r === "prompts" ? "prompt" : "feedback");
  window.scrollTo(0, 0);
}
function bindPrompts() {
  const q = document.getElementById("pq");
  if (q) q.addEventListener("input", () => { promptFilter.q = q.value; redrawPrompts(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { promptFilter.cat = b.dataset.cat; redrawPrompts(); });
}
function redrawPrompts() {
  const wrap = document.getElementById("pq").closest(".lwp");
  const pos = document.getElementById("pq").selectionStart;
  wrap.innerHTML = promptLibrary();
  bindPrompts();
  const q = document.getElementById("pq"); q.focus(); q.setSelectionRange(pos, pos);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Prompt copied. Paste it into Copilot."), () => toast("Select the prompt text and copy it."));
});

// ---- forms (preview only) ----
const opts = a => a.map(o => `<option>${esc(o)}</option>`).join("");
const FORMS = {
  prompt: { title: "Submit a prompt", html: `
    <label>Prompt name</label><input type="text" name="Summary" required>
    <label>Prompt <span class="hint">Use [brackets] for the parts people fill in.</span></label><textarea name="Prompt" required></textarea>
    <label>Category</label><select name="Category">${opts([...new Set(DATA.prompts.map(p => p.Category))])}</select>
    <label>Practice</label><select name="Practice">${opts(["All practices", "Agency lending", "Balance sheet & bridge lending", "CMBS", "Affordable housing", "Leasing", "Restructuring & workouts", "Private client", "Firm operations"])}</select>
    <label>Works in</label><div class="checks">${["Copilot Chat", "Outlook", "Word", "Excel", "PowerPoint", "Teams"].map(a => `<label><input type="checkbox"> ${a}</label>`).join("")}</div>
    <label>How to use it</label><textarea name="How" style="min-height:70px"></textarea>
    <label>Check before you rely on it</label><textarea name="Check" style="min-height:70px"></textarea>
    <div class="foot"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="closePanel()">Cancel</button></div>` },
  feedback: { title: "Share feedback", html: `
    <label>Summary</label><input type="text" name="Summary" required>
    <label>Type</label><select name="Type">${opts(["Idea for a prompt or tip", "Idea for an agent or workflow", "Something isn't working", "A win worth sharing", "Question", "Other"])}</select>
    <label>About</label><select name="About">${opts(["Copilot in general", "Daily Digest", "Email Filing Assistant", "Friday Tips", "Prompt Library", "This site", "Other"])}</select>
    <label>Details</label><textarea name="Details" required></textarea>
    <div class="checks"><label><input type="checkbox" checked> OK to contact me about this?</label></div>
    <div class="foot"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="closePanel()">Cancel</button></div>` }
};
let panelKind = null;
function openPanel(kind) {
  panelKind = kind;
  document.getElementById("panel-title").textContent = FORMS[kind].title;
  document.getElementById("panel-form").innerHTML = FORMS[kind].html;
  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  setTimeout(() => document.querySelector("#panel-form input, #panel-form textarea").focus(), 50);
}
function closePanel() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  if (location.hash.includes("?new")) history.replaceState(null, "", location.hash.split("?")[0]);
}
function submitPanel(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  if (panelKind === "feedback") {
    myFeedback.unshift({ Summary: f.get("Summary"), Type: f.get("Type"), About: f.get("About") });
    closePanel(); route();
    toast("Thanks! In SharePoint this saves to Hub Feedback. (Preview: not saved.)");
  } else {
    closePanel();
    toast("Submitted for approval. It appears once the AI Working Group approves it. (Preview: not saved.)");
  }
  return false;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
