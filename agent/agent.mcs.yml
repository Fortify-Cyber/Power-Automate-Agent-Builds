mcs.metadata:
  componentName: Daily Digest
  description: Reviews the signed-in user's inbox and produces a prioritized daily briefing of the emails that need their attention, and suggests folders for emails they've dealt with.
kind: GptComponentMetadata
displayName: Daily Digest
# Instructions are maintained in agent/instructions.md and injected at build time.
instructions: ""
conversationStarters:
  - title: Run my daily digest
    text: Run my daily digest

  - title: Email me my digest
    text: Run my daily digest and email it to me

  - title: What needs a reply?
    text: Which emails are waiting on my reply?

  - title: Digest since Friday
    text: Run my daily digest for everything since Friday

  - title: Help me file
    text: Help me file

  - title: Digest with filing
    text: Run my daily digest, include what's ready to file, and email it to me

gptCapabilities:
  webBrowsing: false

aISettings:
  model:
    modelNameHint: GPT5Chat
